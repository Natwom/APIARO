<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.replace('index.html');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders — Apiaro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #ff6b00; --primary-light: #ff8533; --primary-glow: rgba(255,107,0,0.15);
            --bg-dark: #0f0f23; --bg-card: rgba(255,255,255,0.03); --bg-hover: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08); --text-primary: #ffffff; --text-secondary: rgba(255,255,255,0.6);
            --text-muted: rgba(255,255,255,0.4); --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary); min-height: 100vh; overflow-x: hidden;
        }
        .admin-layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px; background: rgba(15,15,35,0.95); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border); position: fixed; height: 100vh; left: 0; top: 0; z-index: 100;
            transition: transform 0.3s ease; display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 32px 24px; border-bottom: 1px solid var(--border); }
        .sidebar-header h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 12px; color: white; }
        .sidebar-header h2 i { color: var(--primary); font-size: 28px; }
        .sidebar-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; margin-left: 40px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--text-secondary);
            text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 500; transition: all 0.3s ease; position: relative;
        }
        .sidebar-nav a i { font-size: 18px; width: 24px; text-align: center; }
        .sidebar-nav a:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sidebar-nav a.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white;
            box-shadow: 0 4px 15px rgba(255,107,0,0.3);
        }
        .sidebar-nav a.active::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 60%; background: white; border-radius: 0 4px 4px 0;
        }
        .sidebar-footer { padding: 16px 12px; border-top: 1px solid var(--border); }
        .sidebar-footer a {
            display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: var(--danger);
            text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 500; transition: all 0.3s ease;
        }
        .sidebar-footer a:hover { background: rgba(239,68,68,0.1); }
        .main-content { flex: 1; margin-left: 280px; padding: 32px; min-height: 100vh; }
        .admin-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;
            padding-bottom: 24px; border-bottom: 1px solid var(--border);
        }
        .admin-header h1 {
            font-size: 32px; font-weight: 800;
            background: linear-gradient(135deg, white 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .filters { display: flex; gap: 12px; }
        .filters select {
            padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 14px; font-family: 'Inter', sans-serif; cursor: pointer; outline: none;
        }
        .filters select:focus { border-color: var(--primary); }
        .orders-section {
            background: var(--bg-card); backdrop-filter: blur(10px); border: 1px solid var(--border);
            border-radius: 20px; padding: 28px; position: relative; overflow: hidden;
        }
        .orders-section::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
        }
        .orders-section h2 { font-size: 20px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .orders-section h2::after { content: ''; flex: 1; height: 1px; background: var(--border); margin-left: 12px; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            text-align: left; padding: 14px 16px; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--border);
        }
        tbody td { padding: 16px; font-size: 14px; color: var(--text-secondary); border-bottom: 1px solid rgba(255,255,255,0.03); }
        tbody tr { transition: background 0.2s; }
        tbody tr:hover { background: var(--bg-hover); }
        tbody tr:last-child td { border-bottom: none; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 50px;
            font-size: 12px; font-weight: 600; text-transform: capitalize;
        }
        .status-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .status-pending { background: rgba(245,158,11,0.1); color: #f59e0b; }
        .status-pending::before { background: #f59e0b; }
        .status-paid { background: rgba(59,130,246,0.1); color: #3b82f6; }
        .status-paid::before { background: #3b82f6; }
        .status-processing { background: rgba(107,114,128,0.1); color: #9ca3af; }
        .status-processing::before { background: #9ca3af; }
        .status-shipped { background: rgba(139,92,246,0.1); color: #8b5cf6; }
        .status-shipped::before { background: #8b5cf6; }
        .status-delivered { background: rgba(16,185,129,0.1); color: #10b981; }
        .status-delivered::before { background: #10b981; }
        .status-cancelled { background: rgba(239,68,68,0.1); color: #ef4444; }
        .status-cancelled::before { background: #ef4444; }
        .btn-view {
            padding: 8px 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none; border-radius: 10px; color: white; font-size: 13px; font-weight: 600;
            font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s ease;
        }
        .btn-view:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,107,0,0.3); }
        .total-cell { font-weight: 700; color: var(--success); }
        .customer-cell strong { display: block; color: var(--text-primary); font-weight: 600; }
        .customer-cell small { color: var(--text-muted); }
        .location-cell strong { color: var(--text-primary); font-weight: 600; }
        .location-cell small { display: block; color: var(--text-muted); margin-top: 4px; }
        .order-items-row { background: rgba(255,255,255,0.02); }
        .order-items-row td { padding: 20px; border-top: 2px solid var(--border); }
        .product-item {
            display: inline-flex; align-items: center; gap: 12px; margin: 6px; padding: 10px 14px;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
        }
        .product-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }
        .product-info strong { display: block; font-size: 14px; color: var(--text-primary); }
        .product-info small { color: var(--text-muted); font-size: 12px; }
        .admin-hamburger {
            display: none; position: fixed; top: 20px; left: 20px; z-index: 200;
            background: var(--bg-card); border: 1px solid var(--border); color: white;
            width: 48px; height: 48px; border-radius: 12px; font-size: 20px; cursor: pointer; backdrop-filter: blur(10px);
        }
        .sidebar-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
            justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(10px);
        }
        .modal-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid var(--border);
            border-radius: 24px; padding: 40px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-close {
            position: absolute; top: 20px; right: 20px; background: var(--bg-hover); border: 1px solid var(--border);
            color: var(--text-secondary); width: 40px; height: 40px; border-radius: 12px; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s;
        }
        .modal-close:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .modal-section {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .modal-section h4 { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .modal-section p { margin: 8px 0; color: var(--text-secondary); font-size: 14px; }
        .modal-section p strong { color: var(--text-primary); }
        .modal-product {
            display: flex; gap: 16px; padding: 16px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; margin-bottom: 12px;
        }
        .modal-product img { width: 80px; height: 80px; object-fit: cover; border-radius: 12px; }
        .modal-product-info { flex: 1; }
        .modal-product-info h4 { margin: 0 0 8px 0; color: var(--text-primary); font-size: 16px; }
        .modal-product-info p { margin: 4px 0; color: var(--text-muted); font-size: 13px; }
        .modal-total {
            background: linear-gradient(135deg, rgba(255,107,0,0.1) 0%, rgba(255,133,51,0.1) 100%);
            border: 1px solid rgba(255,107,0,0.2); border-radius: 16px; padding: 20px; text-align: right; margin: 20px 0;
        }
        .modal-total .amount { font-size: 24px; font-weight: 800; color: var(--primary); }
        .modal-total small { color: var(--text-muted); }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; padding-top: 20px; border-top: 1px solid var(--border); }
        .btn-secondary {
            padding: 12px 24px; background: var(--bg-hover); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-secondary); font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s;
        }
        .btn-secondary:hover { background: var(--bg-card); color: var(--text-primary); }
        .btn-primary {
            padding: 12px 24px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none; border-radius: 12px; color: white; font-size: 14px; font-weight: 600;
            font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,107,0,0.3); }
        .status-select {
            width: 100%; padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 15px; font-family: 'Inter', sans-serif; margin: 16px 0; outline: none;
        }
        .status-select:focus { border-color: var(--primary); }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
        .loading-spinner {
            display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
            margin-right: 12px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 80px 20px 20px; }
            .admin-hamburger { display: flex; align-items: center; justify-content: center; }
            .admin-header { flex-direction: column; gap: 16px; align-items: flex-start; }
            .admin-header h1 { font-size: 24px; }
            .modal-card { padding: 24px; }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <button class="admin-hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()" id="sidebar-overlay"></div>

    <div class="admin-layout">
        <aside class="sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-shopping-bag"></i> Apiaro</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="active"><i class="fas fa-clipboard-list"></i> Orders</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="admin-header">
                <h1>All Orders</h1>
                <div class="filters">
                    <select id="status-filter" onchange="filterOrders()">
                        <option value="">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="paid">Paid</option>
                        <option value="processing">Processing</option>
                        <option value="shipped">Shipped</option>
                        <option value="delivered">Delivered</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </header>

            <div class="orders-section">
                <h2><i class="fas fa-shopping-cart"></i> Order List</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Location</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <tr>
                                <td colspan="8" style="text-align:center;padding:40px;">
                                    <span class="loading-spinner"></span> Loading orders...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="order-modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <div class="modal-overlay" id="status-modal">
        <div class="modal-card" style="max-width:400px;">
            <h3 style="margin-bottom:8px;">Update Order Status</h3>
            <p style="color:var(--text-muted);margin-bottom:16px;">Order #<span id="modal-order-id"></span></p>
            <select id="new-status" class="status-select">
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="processing">Processing</option>
                <option value="shipped">Shipped</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <div class="modal-actions">
                <button onclick="closeStatusModal()" class="btn-secondary">Cancel</button>
                <button onclick="confirmStatusUpdate()" class="btn-primary">Update Status</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://apiaro-backend.onrender.com';
        let currentOrderId = null;

        function checkAdminAuth() {
            const token = localStorage.getItem('admin_token');
            if (!token) { window.location.href = 'index.html'; return null; }
            return token;
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'index.html';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            const headers = { 'Authorization': `Bearer ${token}` };
            if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
            return fetch(url, { ...options, headers: { ...headers, ...options.headers } });
        }

        function getFullImageUrl(imageUrl) {
            if (!imageUrl) return 'https://via.placeholder.com/48?text=No+Image';
            if (imageUrl.startsWith('http')) return imageUrl;
            return API_BASE_URL + imageUrl;
        }

        async function loadAllOrders(status = '') {
            try {
                const response = await fetchWithAuth(`${API_BASE_URL}/orders/admin/all`);
                const orders = await response.json();
                const tbody = document.getElementById('orders-table-body');
                if (!tbody) return;
                
                let filteredOrders = status ? orders.filter(o => o.status === status) : orders;
                
                if (filteredOrders.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-inbox"></i><p>No orders found</p></td></tr>`;
                    return;
                }
                
                tbody.innerHTML = filteredOrders.map(order => {
                    const itemsHtml = order.items?.length > 0 
                        ? order.items.map(item => `
                            <div class="product-item">
                                <img src="${getFullImageUrl(item.product_image)}" alt="${item.product_name}" onerror="this.src='https://via.placeholder.com/48?text=No+Image'">
                                <div class="product-info"><strong>${item.product_name}</strong><small>Qty: ${item.quantity} × KES ${parseFloat(item.unit_price).toFixed(2)}</small></div>
                            </div>`).join('')
                        : '<p style="color:var(--text-muted);">No items</p>';
                    
                    return `
                    <tr>
                        <td><strong style="color:var(--text-primary);">#${order.id}</strong></td>
                        <td>${new Date(order.created_at).toLocaleDateString('en-KE', {day:'numeric', month:'short', year:'numeric'})}</td>
                        <td class="customer-cell"><strong>${order.full_name}</strong><small>${order.email}</small></td>
                        <td><div style="display:flex;align-items:center;gap:6px;"><i class="fas fa-phone" style="color:var(--text-muted);font-size:12px;"></i> ${order.phone_number}</div><small style="color:var(--text-muted);">${order.payment_method.toUpperCase()}</small></td>
                        <td class="location-cell"><strong>${order.county}</strong><small>${order.town}, ${order.specific_location}</small></td>
                        <td class="total-cell">KES ${parseFloat(order.total_amount).toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2})}</td>
                        <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                        <td><button onclick="viewOrderDetails(${order.id})" class="btn-view"><i class="fas fa-eye"></i> View</button></td>
                    </tr>
                    <tr class="order-items-row">
                        <td colspan="8">
                            <div style="margin-bottom:12px;font-weight:600;color:var(--text-muted);font-size:13px;"><i class="fas fa-shopping-bag"></i> Products Ordered (${order.items?.length || 0})</div>
                            <div style="display:flex;flex-wrap:wrap;gap:8px;">${itemsHtml}</div>
                        </td>
                    </tr>`;
                }).join('');
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('orders-table-body').innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-exclamation-circle" style="color:var(--danger);"></i><p>Failed to load orders</p></td></tr>`;
            }
        }

        async function viewOrderDetails(orderId) {
            try {
                const response = await fetchWithAuth(`${API_BASE_URL}/orders/admin/all`);
                const orders = await response.json();
                const order = orders.find(o => o.id === orderId);
                if (!order) { alert('Order not found'); return; }

                const itemsHtml = order.items?.length > 0 
                    ? order.items.map(item => `
                        <div class="modal-product">
                            <img src="${getFullImageUrl(item.product_image)}" onerror="this.src='https://via.placeholder.com/80?text=No+Image'" alt="${item.product_name}">
                            <div class="modal-product-info">
                                <h4>${item.product_name}</h4>
                                <p><strong>Product ID:</strong> #${item.product_id}</p>
                                <p><strong>Quantity:</strong> ${item.quantity}</p>
                                <p><strong>Unit Price:</strong> KES ${parseFloat(item.unit_price).toFixed(2)}</p>
                                <p style="color:var(--success);font-weight:700;">Total: KES ${parseFloat(item.total_price).toFixed(2)}</p>
                            </div>
                        </div>`).join('')
                    : '<p style="color:var(--text-muted);">No items in this order</p>';

                const content = `
                    <h2 style="margin-bottom:24px;font-size:24px;">Order #${order.id}</h2>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
                        <div class="modal-section">
                            <h4><i class="fas fa-user"></i> Customer</h4>
                            <p><strong>Name:</strong> ${order.full_name}</p>
                            <p><strong>Email:</strong> ${order.email}</p>
                            <p><strong>Phone:</strong> ${order.phone_number}</p>
                        </div>
                        <div class="modal-section">
                            <h4><i class="fas fa-map-marker-alt"></i> Delivery</h4>
                            <p><strong>County:</strong> ${order.county}</p>
                            <p><strong>Town:</strong> ${order.town}</p>
                            <p><strong>Location:</strong> ${order.specific_location}</p>
                        </div>
                    </div>
                    <div style="margin-bottom:20px;">
                        <h4 style="color:var(--primary);margin-bottom:16px;font-size:16px;"><i class="fas fa-box"></i> Ordered Products</h4>
                        ${itemsHtml}
                        <div class="modal-total">
                            <div class="amount">KES ${parseFloat(order.total_amount).toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
                            <small>(Includes KES 300 delivery fee)</small>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
                        <div class="modal-section">
                            <h4><i class="fas fa-credit-card"></i> Payment</h4>
                            <p><strong>Method:</strong> ${order.payment_method.toUpperCase()}</p>
                            <p><strong>Status:</strong> <span class="status-badge status-${order.status}">${order.status}</span></p>
                        </div>
                        <div class="modal-section">
                            <h4><i class="fas fa-info-circle"></i> Order Info</h4>
                            <p><strong>Date:</strong> ${new Date(order.created_at).toLocaleString('en-KE')}</p>
                            <p><strong>Terms:</strong> ${order.terms_accepted ? 'Yes' : 'No'}</p>
                            <p><strong>SMS:</strong> ${order.sms_sent ? 'Sent' : 'Pending'}</p>
                        </div>
                    </div>
                    ${order.notes ? `<div class="modal-section" style="background:rgba(245,158,11,0.05);border-color:rgba(245,158,11,0.2);"><h4 style="color:#f59e0b;"><i class="fas fa-sticky-note"></i> Notes</h4><p style="color:#f59e0b;">${order.notes}</p></div>` : ''}
                    <div class="modal-actions">
                        <button onclick="closeModal()" class="btn-secondary">Close</button>
                        <button onclick="openStatusModal(${order.id}, '${order.status}')" class="btn-primary"><i class="fas fa-edit"></i> Update Status</button>
                    </div>`;
                
                document.getElementById('modal-content').innerHTML = content;
                document.getElementById('order-modal').style.display = 'flex';
            } catch (error) { console.error('Error:', error); alert('Failed to load order details'); }
        }

        function closeModal() { document.getElementById('order-modal').style.display = 'none'; }
        function openStatusModal(orderId, currentStatus) {
            currentOrderId = orderId;
            document.getElementById('modal-order-id').textContent = orderId;
            document.getElementById('new-status').value = currentStatus;
            document.getElementById('status-modal').style.display = 'flex';
        }
        function closeStatusModal() { document.getElementById('status-modal').style.display = 'none'; currentOrderId = null; }

        async function confirmStatusUpdate() {
            if (!currentOrderId) return;
            const newStatus = document.getElementById('new-status').value;
            try {
                const response = await fetchWithAuth(`${API_BASE_URL}/orders/admin/${currentOrderId}/status`, { method: 'PATCH', body: JSON.stringify({ status: newStatus }) });
                if (response.ok) { closeStatusModal(); closeModal(); loadAllOrders(); alert('Status updated!'); }
                else { const error = await response.json(); alert('Failed: ' + (error.detail || 'Unknown error')); }
            } catch (error) { console.error('Error:', error); alert('Error updating status'); }
        }

        function filterOrders() { loadAllOrders(document.getElementById('status-filter').value); }

        document.getElementById('order-modal').addEventListener('click', (e) => { if (e.target.id === 'order-modal') closeModal(); });
        document.getElementById('status-modal').addEventListener('click', (e) => { if (e.target.id === 'status-modal') closeStatusModal(); });

        document.addEventListener('DOMContentLoaded', () => { checkAdminAuth(); loadAllOrders(); });

        function toggleSidebar() {
            var sb = document.getElementById('admin-sidebar');
            var ov = document.getElementById('sidebar-overlay');
            if (!sb) return;
            sb.classList.toggle('active');
            if (ov) ov.classList.toggle('active');
            document.body.style.overflow = sb.classList.contains('active') ? 'hidden' : '';
        }
    </script>
</body>
</html>
