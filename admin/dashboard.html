<!DOCTYPE html>
<html lang="en">
<head>
    <!-- AUTH GUARD: Redirect to login if not authenticated as admin -->
    <script>
        (function() {
            const token = localStorage.getItem('admin_token');
            const userStr = localStorage.getItem('admin_user');

            if (!token || !userStr) {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                window.location.replace('index.html');
                return;
            }

            try {
                const user = JSON.parse(userStr);
                if (user.is_admin !== true) {
                    console.warn('Non-admin user attempted to access dashboard.');
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_user');
                    window.location.replace('index.html');
                    return;
                }
            } catch (e) {
                console.error('Corrupt admin user data. Redirecting to login.');
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                window.location.replace('index.html');
                return;
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Apiaro Admin</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b00;
            --primary-light: #ff8533;
            --primary-glow: rgba(255, 107, 0, 0.15);
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-muted: rgba(255, 255, 255, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Sidebar */
        .admin-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 15, 35, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 32px 24px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }

        .sidebar-header h2 i {
            color: var(--primary);
            font-size: 28px;
        }

        .sidebar-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-left: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .sidebar-nav a i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .sidebar-nav a:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-nav a.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .sidebar-nav a.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: white;
            border-radius: 0 4px 4px 0;
        }

        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid var(--border);
        }

        .sidebar-footer a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            color: var(--danger);
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .sidebar-footer a:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 32px;
            min-height: 100vh;
        }

        /* Header */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .admin-header h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, white 0%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 50px;
        }

        .admin-user i {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .admin-user span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Stats Grid */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 107, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card i {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .stat-card:nth-child(1) i {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .stat-card:nth-child(2) i {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .stat-card:nth-child(3) i {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .stat-card:nth-child(4) i {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.15) 0%, rgba(255, 133, 51, 0.15) 100%);
            color: var(--primary);
        }

        .stat-card h3 {
            font-size: 32px;
            font-weight: 800;
            color: white;
            margin-bottom: 4px;
        }

        .stat-card p {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Recent Orders Section */
        .recent-orders {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
        }

        .recent-orders::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
        }

        .recent-orders h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recent-orders h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 12px;
        }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 14px 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .status-pending::before {
            background: #f59e0b;
        }

        .status-paid {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .status-paid::before {
            background: #3b82f6;
        }

        .status-processing {
            background: rgba(107, 114, 128, 0.1);
            color: #9ca3af;
        }

        .status-processing::before {
            background: #9ca3af;
        }

        .status-shipped {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        .status-shipped::before {
            background: #8b5cf6;
        }

        .status-delivered {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status-delivered::before {
            background: #10b981;
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .status-cancelled::before {
            background: #ef4444;
        }

        .sms-sent {
            color: #10b981;
        }

        .sms-pending {
            color: var(--text-muted);
        }

        /* Hamburger */
        .admin-hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Loading State */
        .loading-row td {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 80px 20px 20px;
            }

            .admin-hamburger {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .admin-header {
                flex-direction: column;
                gap: 16px;
                align-items: flex-start;
            }

            .admin-header h1 {
                font-size: 24px;
            }

            .dashboard-stats {
                grid-template-columns: 1fr;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-card h3 {
                font-size: 24px;
            }

            table {
                font-size: 13px;
            }

            tbody td {
                padding: 12px 10px;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <button class="admin-hamburger" onclick="toggleSidebar()">☰</button>

    <div class="sidebar-overlay" onclick="toggleSidebar()" id="sidebar-overlay"></div>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-shopping-bag"></i> Apiaro</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-clipboard-list"></i> Orders</a>
                <a href="users.html"><i class="fas fa-users"></i> Users</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" onclick="logout(); return false;"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="admin-header">
                <h1>Dashboard</h1>
                <div class="admin-user">
                    <i class="fas fa-user-shield"></i>
                    <span id="admin-name">Administrator</span>
                </div>
            </header>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <i class="fas fa-box"></i>
                    <div>
                        <h3 id="total-products">0</h3>
                        <p>Total Products</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-shopping-cart"></i>
                    <div>
                        <h3 id="total-orders">0</h3>
                        <p>Total Orders</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-clock"></i>
                    <div>
                        <h3 id="pending-orders">0</h3>
                        <p>Pending Orders</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-money-bill-wave"></i>
                    <div>
                        <h3 id="total-revenue">KES 0</h3>
                        <p>Revenue</p>
                    </div>
                </div>
            </div>

            <div class="recent-orders">
                <h2><i class="fas fa-history"></i> Recent Orders</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Phone</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>SMS</th>
                            </tr>
                        </thead>
                        <tbody id="recent-orders-body">
                            <tr class="loading-row">
                                <td colspan="7">
                                    <span class="loading-spinner"></span>
                                    Loading orders...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_API_URL = 'https://apiaro-backend.onrender.com';

        function checkAdminAuth() {
            const token = localStorage.getItem('admin_token');
            const userStr = localStorage.getItem('admin_user');

            if (!token || !userStr) {
                window.location.href = 'index.html';
                return null;
            }

            try {
                const user = JSON.parse(userStr);
                if (user.is_admin !== true) {
                    logout();
                    return null;
                }
                const nameEl = document.getElementById('admin-name');
                if (nameEl && user.full_name) {
                    nameEl.textContent = user.full_name;
                }
                return token;
            } catch (e) {
                console.error('Corrupt user data in checkAdminAuth');
                logout();
                return null;
            }
        }

        function logout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
            window.location.href = 'index.html';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            return fetch(url, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            });
        }

        async function loadDashboardStats() {
            try {
                const productsRes = await fetchWithAuth(`${ADMIN_API_URL}/products/`);
                const products = await productsRes.json();
                document.getElementById('total-products').textContent = products.length;

                const ordersRes = await fetchWithAuth(`${ADMIN_API_URL}/orders/admin/all`);
                const orders = await ordersRes.json();

                document.getElementById('total-orders').textContent = orders.length;
                document.getElementById('pending-orders').textContent = 
                    orders.filter(o => o.status === 'pending').length;

                const revenue = orders.reduce((sum, o) => sum + parseFloat(o.total_amount), 0);
                document.getElementById('total-revenue').textContent = `KES ${revenue.toLocaleString('en-KE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                const recentOrders = orders.slice(0, 5);
                const tbody = document.getElementById('recent-orders-body');
                
                if (recentOrders.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="7" class="empty-state">
                                <i class="fas fa-inbox"></i>
                                <p>No orders yet</p>
                            </td>
                        </tr>
                    `;
                    return;
                }

                if (tbody) {
                    tbody.innerHTML = recentOrders.map(order => `
                        <tr>
                            <td><strong>#${order.id}</strong></td>
                            <td>${order.full_name}</td>
                            <td>${order.phone_number}</td>
                            <td style="font-weight: 600; color: white;">KES ${parseFloat(order.total_amount).toLocaleString('en-KE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                            <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                            <td>${new Date(order.created_at).toLocaleDateString('en-KE', {day: 'numeric', month: 'short', year: 'numeric'})}</td>
                            <td>${order.sms_sent ? '<i class="fas fa-check-circle sms-sent"></i>' : '<i class="fas fa-times-circle sms-pending"></i>'}</td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('recent-orders-body').innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="fas fa-exclamation-circle" style="color: var(--danger);"></i>
                            <p>Failed to load orders</p>
                        </td>
                    </tr>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = checkAdminAuth();
            if (!token) return;
            loadDashboardStats();
        });
    </script>

    <script>
    (function(){
        function toggleSidebar() {
            var sb = document.getElementById('admin-sidebar');
            var ov = document.getElementById('sidebar-overlay');
            if (!sb) return;
            sb.classList.toggle('active');
            if (ov) ov.classList.toggle('active');
            document.body.style.overflow = sb.classList.contains('active') ? 'hidden' : '';
        }
        window.toggleSidebar = toggleSidebar;

        document.addEventListener('DOMContentLoaded', function(){
            var sb = document.getElementById('admin-sidebar');
            if (sb) {
                sb.querySelectorAll('a').forEach(function(a){
                    a.addEventListener('click', function(){
                        if (window.innerWidth <= 768) toggleSidebar();
                    });
                });
            }
            var ov = document.getElementById('sidebar-overlay');
            if (ov) ov.addEventListener('click', toggleSidebar);
        });
    })();
    </script>
</body>
</html>
