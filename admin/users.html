<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.replace('index.html');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Apiaro Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <button class="admin-hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-shopping-bag"></i> Apiaro</h2>
                <p>Admin Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="products.html"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html"><i class="fas fa-clipboard-list"></i> Orders</a>
                <a href="users.html" class="active"><i class="fas fa-users"></i> Users</a>
                <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="admin-header">
                <h1>User Management</h1>
                <div class="stats-summary">
                    <span id="total-users">0 Users</span>
                </div>
            </header>

            <div class="users-table-container">
                <div class="table-responsive">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone Number</th>
                                <th>Registered Date</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        function checkAdminAuth() {
            const token = localStorage.getItem('admin_token');
            if (!token) {
                window.location.href = 'index.html';
                return null;
            }
            return token;
        }

        function logout() {
            localStorage.removeItem('admin_token');
            window.location.href = 'index.html';
        }

        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('admin_token');
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                ...options.headers
            };
            return fetch(url, { ...options, headers: headers });
        }

        async function loadUsers() {
            try {
                const res = await fetchWithAuth('https://apiaro-backend.onrender.com/users/admin/all');
                if (res.status === 401) {
                    throw new Error('401 Unauthorized - Token invalid or expired.');
                }
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP ${res.status}: ${errorText}`);
                }
                
                const users = await res.json();
                let usersArray = Array.isArray(users) ? users : (users.users || []);
                
                document.getElementById('total-users').textContent = usersArray.length + ' Users';
                
                const tbody = document.getElementById('users-table-body');
                if (usersArray.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;">No users found</td></tr>';
                    return;
                }
                
                tbody.innerHTML = usersArray.map(user => `
                    <tr>
                        <td>#${user.id}</td>
                        <td><strong>${user.full_name || 'N/A'}</strong></td>
                        <td>${user.email}</td>
                        <td>${user.phone_number || 'N/A'}</td>
                        <td>${user.created_at ? new Date(user.created_at).toLocaleDateString('en-KE') : 'N/A'}</td>
                    </tr>
                `).join('');
                
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('users-table-body').innerHTML = 
                    `<tr><td colspan="5" style="text-align:center;padding:2rem;color:red;">
                        Error: ${error.message}<br>
                        <button onclick="logout()" style="margin-top: 10px; padding: 5px 15px;">Go to Login</button>
                    </td></tr>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = checkAdminAuth();
            if (token) loadUsers();
        });
    </script>

    <script>
    function toggleSidebar() {
        var sidebar = document.querySelector('.sidebar');
        var overlay = document.querySelector('.sidebar-overlay');
        if (!sidebar) return;
        sidebar.classList.toggle('active');
        if (overlay) overlay.classList.toggle('active');
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
    }
    document.addEventListener('DOMContentLoaded', function() {
        var sidebar = document.querySelector('.sidebar');
        if (sidebar) {
            sidebar.querySelectorAll('a').forEach(function(link) {
                link.addEventListener('click', function() {
                    if (window.innerWidth <= 768) toggleSidebar();
                });
            });
        }
    });
    </script>
</body>
</html>
