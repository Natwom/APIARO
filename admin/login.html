<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Apiaro</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Spinner Overlay */
        .spinner-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }
        .spinner-overlay.active {
            display: flex;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff6b00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Auth Messages */
        .auth-message {
            margin-top: 15px;
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
            font-size: 0.95rem;
            text-align: center;
            font-weight: 500;
        }
        .auth-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .auth-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Disabled button state */
        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
<base target="_blank">
</head>
<body class="auth-page">

    <!-- FIXED: Validate token is actually an admin token before redirecting to dashboard -->
    <script>
        (function() {
            const token = localStorage.getItem('admin_token');
            const userStr = localStorage.getItem('admin_user');

            // Only redirect if we have BOTH token AND valid admin user data
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.is_admin === true) {
                        // Valid admin session - redirect to dashboard
                        window.location.replace('index.html');
                    } else {
                        // Token exists but user is NOT admin - clear bad data and stay on login
                        console.warn('Non-admin token detected, clearing...');
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_user');
                    }
                } catch (e) {
                    // Corrupt user data - clear everything and stay on login
                    console.error('Corrupt admin user data, clearing...');
                    localStorage.removeItem('admin_token');
                    localStorage.removeItem('admin_user');
                }
            }
            // If no token or no user data, stay on login page (no redirect)
        })();
    </script>

    <!-- Spinner -->
    <div class="spinner-overlay" id="spinner-overlay">
        <div class="spinner"></div>
        <p id="spinner-text">Logging in...</p>
    </div>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-lock logo-icon"></i>
                <h1>Admin Panel</h1>
                <p>Authorized personnel only</p>
            </div>

            <form id="admin-login-form" class="auth-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required value="admin@kenyashop.co.ke">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required value="admin123">
                </div>
                <button type="submit" class="btn-auth" id="login-btn">Login to Dashboard</button>
                <div id="auth-message" class="auth-message"></div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://apiaro-backend.onrender.com';
        const spinnerOverlay = document.getElementById('spinner-overlay');
        const spinnerText = document.getElementById('spinner-text');
        const msgDiv = document.getElementById('auth-message');
        const loginBtn = document.getElementById('login-btn');

        function showSpinner(text) {
            spinnerText.textContent = text || 'Logging in...';
            spinnerOverlay.classList.add('active');
            loginBtn.disabled = true;
        }

        function hideSpinner() {
            spinnerOverlay.classList.remove('active');
            loginBtn.disabled = false;
        }

        function showMessage(text, type) {
            msgDiv.textContent = text;
            msgDiv.className = 'auth-message ' + type;
        }

        function clearMessage() {
            msgDiv.className = 'auth-message';
            msgDiv.textContent = '';
        }

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();
            showSpinner('Authenticating...');

            const credentials = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });

                const data = await response.json();

                if (!response.ok || !data.access_token) {
                    hideSpinner();
                    showMessage('❌ ' + (data.detail || 'Invalid email or password. Please try again.'), 'error');
                    return;
                }

                // Store token
                localStorage.setItem('admin_token', data.access_token);

                // Store user info (so auth guard on dashboard doesn't reject us)
                if (data.user) {
                    // Ensure is_admin flag is set
                    const userData = {
                        ...data.user,
                        is_admin: data.user.is_admin === true
                    };
                    localStorage.setItem('admin_user', JSON.stringify(userData));
                } else {
                    // Fallback: create minimal user object so dashboard auth works
                    localStorage.setItem('admin_user', JSON.stringify({
                        email: credentials.email,
                        is_admin: true,
                        full_name: 'Administrator'
                    }));
                }

                showSpinner('Success! Redirecting...');
                showMessage('✅ Login successful! Redirecting to dashboard...', 'success');

                // Let user see success message for 1 second, then redirect
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1200);

            } catch (error) {
                hideSpinner();
                showMessage('❌ Network error: ' + error.message, 'error');
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
