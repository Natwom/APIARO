<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — APIARO</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b00">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b00;
            --primary-dark: #e65100;
            --primary-light: #fff3e0;
            --secondary: #1a1a2e;
            --text: #2d3748;
            --text-light: #718096;
            --bg: #f8fafc;
            --white: #ffffff;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --radius: 16px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 48px rgba(0,0,0,0.12);
            --shadow-glow: 0 0 0 4px rgba(255,107,0,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fff8f0 0%, #f0f4ff 50%, #fff0f3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, var(--primary), #ff8533);
            top: -100px; right: -100px;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            bottom: -50px; left: -50px;
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(1.05); }
        }

        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255,255,255,0.6);
            overflow: hidden;
        }

        .auth-header {
            padding: 40px 32px 24px;
            text-align: center;
        }
        .brand-badge {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), #ff8533);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(255,107,0,0.3);
            animation: pulseBadge 2s ease-in-out infinite;
        }
        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(255,107,0,0.3); }
            50% { transform: scale(1.05); box-shadow: 0 12px 32px rgba(255,107,0,0.4); }
        }
        .brand-badge i {
            font-size: 28px;
            color: white;
        }
        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--secondary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .auth-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .auth-form {
            padding: 0 32px 32px;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap > i:first-child {
            position: absolute;
            left: 14px;
            color: var(--text-light);
            font-size: 1rem;
            transition: color 0.2s;
            z-index: 2;
        }
        .input-wrap input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--white);
            transition: all 0.2s ease;
            outline: none;
        }
        .input-wrap input:focus {
            border-color: var(--primary);
            box-shadow: var(--shadow-glow);
        }
        .input-wrap input:focus + i:first-child,
        .input-wrap:focus-within > i:first-child {
            color: var(--primary);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            padding-right: 44px !important;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 0.95rem;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .toggle-password:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .hint {
            display: block;
            margin-top: 6px;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* Password Strength */
        .strength-meter {
            margin-top: 8px;
        }
        .strength-track {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: all 0.4s ease;
        }
        .strength-weak { background: var(--error); width: 33%; }
        .strength-medium { background: var(--warning); width: 66%; }
        .strength-strong { background: var(--success); width: 100%; }
        .strength-text {
            font-size: 0.8rem;
            margin-top: 4px;
            font-weight: 600;
            transition: color 0.3s;
        }

        /* Match Indicator */
        .match-indicator {
            font-size: 0.85rem;
            margin-top: 6px;
            display: none;
            font-weight: 600;
            align-items: center;
            gap: 4px;
        }
        .match-indicator.show { display: flex; }
        .match-indicator.match { color: var(--success); }
        .match-indicator.no-match { color: var(--error); }

        /* Terms */
        .terms-wrap {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
            cursor: pointer;
            user-select: none;
        }
        .terms-wrap input {
            width: 18px; height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .terms-wrap span {
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.4;
        }
        .terms-wrap a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .terms-wrap a:hover { text-decoration: underline; }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), #ff8533);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(255,107,0,0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-auth::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,107,0,0.4);
        }
        .btn-auth:hover::after {
            left: 100%;
        }
        .btn-auth:active { transform: translateY(0); }
        .btn-auth:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            padding: 24px 32px;
            background: linear-gradient(to bottom, transparent, rgba(255,107,0,0.03));
            border-top: 1px solid rgba(0,0,0,0.04);
            text-align: center;
        }
        .auth-footer p {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }
        .auth-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-light) !important;
            font-size: 0.85rem;
            font-weight: 500 !important;
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .back-link:hover {
            color: var(--text) !important;
            gap: 10px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 22px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            z-index: 10001;
            box-shadow: var(--shadow-lg);
            transform: translateX(150%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: 360px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { background: linear-gradient(135deg, var(--success), #059669); }
        .toast.error { background: linear-gradient(135deg, var(--error), #dc2626); }
        .toast.warning { background: linear-gradient(135deg, var(--warning), #d97706); }

        @media (max-width: 480px) {
            .auth-form, .auth-header { padding-left: 20px; padding-right: 20px; }
            body::before { width: 250px; height: 250px; }
            body::after { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-badge">
                    <i class="fas fa-shopping-bag"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join thousands of happy shoppers</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" id="full_name" name="full_name" required placeholder="Daniel Natwom">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" required placeholder="your@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div class="input-wrap">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" name="phone" required 
                               placeholder="+254712345678" 
                               pattern="\+254\d{9}"
                               title="Format: +254 followed by 9 digits">
                    </div>
                    <span class="hint">Format: +254712345678</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required 
                                   placeholder="Create a strong password" minlength="6" oninput="checkPasswordStrength()">
                            <button type="button" class="toggle-password" onclick="togglePassword('password', this)" title="Show/Hide Password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="strength-meter">
                        <div class="strength-track">
                            <div id="strength-fill" class="strength-fill"></div>
                        </div>
                        <div id="strength-text" class="strength-text"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <div class="password-wrapper">
                            <input type="password" id="confirm_password" name="confirm_password" required 
                                   placeholder="Repeat your password" minlength="6" oninput="checkPasswordMatch()">
                            <button type="button" class="toggle-password" onclick="togglePassword('confirm_password', this)" title="Show/Hide Password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div id="match-indicator" class="match-indicator"></div>
                </div>

                <label class="terms-wrap">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the <a href="#" target="_blank">Terms & Conditions</a> and <a href="#" target="_blank">Privacy Policy</a></span>
                </label>

                <button type="submit" class="btn-auth" id="register-btn">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in</a></p>
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/auth.js"></script>
    <script>
        // ========== PASSWORD TOGGLE ==========
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                btn.title = 'Hide Password';
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                btn.title = 'Show Password';
            }
        }

        // ========== PASSWORD STRENGTH ==========
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            fill.className = 'strength-fill';
            
            if (password.length === 0) {
                text.textContent = '';
            } else if (strength <= 2) {
                fill.classList.add('strength-weak');
                text.textContent = 'Weak — add numbers & symbols';
                text.style.color = 'var(--error)';
            } else if (strength <= 3) {
                fill.classList.add('strength-medium');
                text.textContent = 'Medium — looking good';
                text.style.color = 'var(--warning)';
            } else {
                fill.classList.add('strength-strong');
                text.textContent = 'Strong — excellent password!';
                text.style.color = 'var(--success)';
            }
            checkPasswordMatch();
        }

        // ========== PASSWORD MATCH ==========
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const indicator = document.getElementById('match-indicator');
            
            if (confirm.length === 0) {
                indicator.className = 'match-indicator';
                return;
            }
            
            indicator.classList.add('show');
            if (password === confirm) {
                indicator.innerHTML = '<i class="fas fa-check-circle"></i> Passwords match';
                indicator.className = 'match-indicator show match';
            } else {
                indicator.innerHTML = '<i class="fas fa-times-circle"></i> Passwords do not match';
                indicator.className = 'match-indicator show no-match';
            }
        }

        // ========== REGISTER ==========
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                showToast('Passwords do not match! Please check and try again.', 'error');
                document.getElementById('confirm_password').focus();
                return;
            }
            if (password.length < 6) {
                showToast('Password must be at least 6 characters long.', 'error');
                document.getElementById('password').focus();
                return;
            }
            
            const btn = document.getElementById('register-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            btn.disabled = true;
            
            const formData = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                phone_number: document.getElementById('phone').value,
                password: password
            };

            try {
                const response = await fetch(`${API_BASE_URL}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Account created successfully! Please login.', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showToast(data.detail || 'Registration failed', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
                console.error('Registration error:', error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // ========== TOAST ==========
        function showToast(message, type) {
            const existingToasts = document.querySelectorAll('.toast');
            existingToasts.forEach(t => t.remove());
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle' };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.success}"></i> <span>${message}</span>`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
    <script src="pwa.js"></script>
</body>
</html>
