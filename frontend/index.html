<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIARO - Your Online Marketplace</title>
    
    <!-- SPLASH SCREEN CSS - INLINE FOR INSTANT RENDER -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        #apiaro-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        #apiaro-splash.hide {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }
        
        .splash-logo {
            width: 150px; height: 150px;
            margin-bottom: 30px;
            animation: splashPulse 2s ease-in-out infinite;
        }
        
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        .splash-brand {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        
        .splash-brand span { color: #ff6b00; }
        
        .splash-tagline {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ff6b00;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }
        
        .splash-loader {
            width: 180px; height: 3px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .splash-loader::after {
            content: '';
            position: absolute;
            top: 0; left: -50%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, #ff6b00, #ff8533);
            border-radius: 3px;
            animation: splashSlide 1.5s ease-in-out infinite;
        }
        
        @keyframes splashSlide {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        
        .app-content {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .app-content.show { opacity: 1; }
    </style>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b00">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="apiaro-splash">
        <img src="icon-512x512.png" alt="Apiaro" class="splash-logo">
        <div class="splash-brand">Api<span>aro</span></div>
        <div class="splash-tagline">Shop More. Live Better.</div>
        <div class="splash-loader"></div>
    </div>
    
    <!-- APP CONTENT -->
    <div class="app-content" id="app-content">
    </div>
    
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="pwa.js"></script>
    
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('app-content').classList.add('show');
                document.getElementById('apiaro-splash').classList.add('hide');
            }, 2000);
        });
        
        setTimeout(() => {
            const splash = document.getElementById('apiaro-splash');
            const app = document.getElementById('app-content');
            if (splash && !splash.classList.contains('hide')) {
                app.classList.add('show');
                splash.classList.add('hide');
            }
        }, 5000);
    </script>
</body>
</html>
