<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Products - APIARO</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Only keep modal + footer link helpers here.
           ALL product-grid styles now live in main.css */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: white;
            padding: 0;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }
        .modal-header {
            padding: 28px 32px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .modal-title i {
            width: 40px; height: 40px;
            background: #fff0e6;
            color: #ff6b00;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: #f8f6f3;
            color: #636e72;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .modal-close:hover {
            background: #ff6b00;
            color: white;
            transform: rotate(90deg);
        }
        .modal-body {
            padding: 24px 32px 32px;
            line-height: 1.8;
            color: #636e72;
        }
        .modal-body h4 {
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 700;
            margin: 24px 0 12px;
        }
        .modal-body ul, .modal-body ol {
            padding-left: 20px;
            margin: 12px 0;
        }
        .modal-body li { margin: 8px 0; padding-left: 4px; }
        .modal-body strong { color: #1a1a2e; }
        .contact-box {
            background: #faf9f7;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #e8e6e3;
        }
        .contact-box p {
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2d3436;
        }
        .contact-box p i {
            width: 32px; height: 32px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6b00;
            font-size: 0.9rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }

        .footer-bottom-links a {
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .footer-bottom-links a:hover { color: #d4a853; }

        .trust-badges {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 40px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
        }
        .trust-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.6);
        }
        .trust-badge i { font-size: 1.25rem; color: #d4a853; }

        @media (max-width: 768px) {
            .trust-badges { gap: 20px; }
        }
    </style>
    <base target="_blank">
</head>
